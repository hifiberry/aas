# Installed as /usr/lib/systemd/system/bluealsa-aplay.service.d/aas.conf.
#
# Plays each connected phone into default, which under aas is the aas
# plugin. Skipped unless aas is chosen, as bluealsa.service is.
#
# --volume=mixer: the phone's volume (AVRCP absolute volume) goes to aas's
# Master on the default ctl, not into the samples, so the phone, the web UI
# and the players share one volume. When a stream starts, bluealsa-aplay
# sends the phone Master's current value.
[Service]
ExecCondition=/bin/sh -c 'grep -qsx aas /etc/hifiberry/audio-server'
ExecStart=
ExecStart=/usr/bin/bluealsa-aplay -S --pcm=default --volume=mixer --mixer-device=default --mixer-name=Master
