# Installed as /usr/lib/systemd/system/bluealsa.service.d/aas.conf.
#
# bluez-alsa is the Bluetooth sink under aas only. Under PipeWire, its
# bluez5 is the sink, and a second A2DP endpoint registered with BlueZ
# would compete with it, so the unit is skipped unless aas is chosen.
# A skipped condition is not a failure. Debian enables the unit; this
# keeps it enabled and switches it with the choice file instead.
[Service]
ExecCondition=/bin/sh -c 'grep -qsx aas /etc/hifiberry/audio-server'
# The device is a speaker: the A2DP sink only, not a source.
ExecStart=
ExecStart=/usr/bin/bluealsa -S -p a2dp-sink
