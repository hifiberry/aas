# Keep memory compaction away from locked pages.
#
# aas locks its memory so that a page fault cannot delay the audio thread. A
# locked page stays in memory, but by default the kernel may still move it when
# it compacts memory, and a thread that touches a page while it is moved waits
# for the move to end. Under load on a Pi 3 that stalled the audio thread for
# 15 to 34 ms, longer than the buffer. See doc/measurements.md, "Why the
# 44.1 kHz hour failed on the Pi 3".
#
# This is a system-wide setting, and the default on real-time kernels.
vm.compact_unevictable_allowed = 0
