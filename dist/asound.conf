# ALSA configuration for aas: the default device plays through the daemon
# and records its analog input, and its mixer is the daemon's output volume.
# Installed as /etc/asound.conf by dist/install-plugin.sh.

# The plugin itself. It plays S16, S24, S24_3LE, S32 and FLOAT, mono or
# stereo, from 8 to 384 kHz. It records S32 stereo at the daemon's rate.
pcm.aas {
	type aas
	hint {
		show on
		description "Alternative audio server"
	}
}

# Anything else a player or a recorder asks for is converted by plug.
pcm.!default {
	type plug
	slave.pcm "aas"
}

# The control: one element, Master, which is the daemon's output volume.
ctl.aas {
	type aas
}

# Mixers that open the default device, such as amixer, alsactl and mpd's
# hardware mixer, get it too.
ctl.!default {
	type aas
}
