[workspace]
members = [".", "crates/aas-client", "tools/measure"]
default-members = [".", "crates/aas-client", "tools/measure"]

[package]
name = "aas"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Alternative audio server"
license = "MIT"
repository = "https://github.com/hifiberry/aas"

[lib]
name = "aas"
path = "src/lib.rs"

[[bin]]
name = "aas"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
