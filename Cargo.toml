[workspace]
members = [".", "crates/aas-client", "tools/measure"]
default-members = [".", "crates/aas-client", "tools/measure"]

[package]
name = "aas"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Alternative audio server"
license = "MIT"
repository = "https://github.com/hifiberry/aas"

[lib]
name = "aas"
path = "src/lib.rs"

[[bin]]
name = "aas"
path = "src/main.rs"

[dependencies]
aas-client = { version = "0.1.0", path = "crates/aas-client" }
audioadapter-buffers = "4"
libc = "0.2"
rtrb = "0.4"
rubato = "4"
serde = { version = "1", features = ["derive"] }
toml = "1"

[dev-dependencies]
assert_no_alloc = "1"
tempfile = "3"
