[workspace]
members = [
    ".",
    "crates/aas-alsa",
    "crates/aas-client",
    "crates/aas-plugin",
    "plugins/fixture-bad",
    "plugins/fixture-v1",
    "plugins/fixture-wide",
    "plugins/gain",
    "tools/measure",
]
default-members = [
    ".",
    "crates/aas-client",
    "crates/aas-plugin",
    "plugins/fixture-bad",
    "plugins/fixture-v1",
    "plugins/fixture-wide",
    "plugins/gain",
    "tools/measure",
]

[package]
name = "aas"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Alternative audio server"
license = "MIT"
repository = "https://github.com/hifiberry/aas"

[lib]
name = "aas"
path = "src/lib.rs"

[[bin]]
name = "aas"
path = "src/main.rs"

[[bin]]
name = "aasctl"
path = "src/bin/aasctl/main.rs"

[features]
# Drive a sound card through ALSA. Needs libasound2-dev to build.
alsa-output = ["dep:alsa"]

[dependencies]
aas-client = { version = "0.1.0", path = "crates/aas-client" }
aas-plugin = { version = "0.1.0", path = "crates/aas-plugin" }
alsa = { version = "0.12.1", optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "ws", "tokio"] }
audioadapter-buffers = "4"
libc = "0.2"
rtrb = "0.4"
rubato = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "net", "sync", "time"] }
toml = "1"
# The WebSocket client of `aasctl events` and `levels`; HTTP is done by hand.
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
# AirPlay 2: transient pairing (SRP-6a over big integers, SHA-512), the
# control channel's keys (HKDF) and the sealed channel and audio.
chacha20poly1305 = "0.10.1"
hkdf = "0.12.4"
num-bigint = "0.4"
sha2 = "0.10.9"
# AirPlay 2 PIN pairing (HomeKit pair-setup and pair-verify): long-term
# Ed25519 keys and the X25519 exchange of each session.
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
# Song metadata: ACR's REST answers and the covers it points to, which can
# be on the internet over HTTPS. Used only in the metadata source's thread.
ureq = { version = "2", default-features = false, features = ["tls"] }

[dev-dependencies]
# Without its default `disable_release`, so the allocation checks also run
# in release builds, which the audio thread is.
assert_no_alloc = { version = "1", default-features = false }
# Only for the SRP test vectors of RFC 5054, which use SHA-1.
sha1 = "0.10"
tempfile = "3"
# Only its re-exported blocking client, to talk to `/events`.
tokio-tungstenite = "0.29"

# One codegen unit and link-time optimisation across the crates, so the ring
# functions of aas-client are inlined into the audio thread's cycle.
[profile.release]
lto = "thin"
codegen-units = 1
